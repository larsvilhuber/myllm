services:
  openwebui:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      BYPASS_MODEL_ACCESS_CONTROL: true 
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_SECRET_KEY: ${SECRET_KEY}
      ENABLE_RAG: true
      ENABLE_FILE_UPLOAD: true
      FILE_UPLOAD_ENABLED: true
      MAX_FILE_SIZE: 250MB
      CHROMA_PERSIST_DIRECTORY: /app/backend/data/vector_db
      ALLOWED_FILE_TYPES: "pdf,txt,doc,docx,md,mp3,wav,m4a,ogg"
      PDF_EXTRACT_IMAGES: true
      RAG_FILE_MAX_AGE: 2592000
      CLEANUP_INTERVAL: 86400
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 100
      ENABLE_WHISPER_LOCAL: True
      WHISPER_MODEL: medium
      ENABLE_STT: true
      STT_ENGINE: whisper_local
      WHISPER_MODEL_DIR: /app/backend/data/cache/whisper
      WHISPER_COMPUTE_TYPE: float16
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
              driver: nvidia
              count: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
              driver: nvidia
              count: all
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama

  gpu-monitor:
    image: ubuntu:22.04
    restart: unless-stopped
    pid: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      REFRESH_SECONDS: "30"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
              driver: nvidia
              count: all
    volumes:
      - /home/www/system:/output
      - ./gpu-monitor.sh:/gpu-monitor.sh:ro
    command: ["/bin/bash", "/gpu-monitor.sh"]
